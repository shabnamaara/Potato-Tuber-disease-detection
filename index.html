<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potato Tuber Disease Classification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('static/sun.jpg') center fixed;
            background-size: cover;
            margin: 0;
            padding: 50px;
        }
        form {
            background: rgba(0,0,0, 0.5);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        #preview {
            max-width: 300px;
            margin-top: 20px;
            display: none;
            border-radius: 5px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Potato Tuber Disease Classification</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="file" id="fileInput" accept=".png, .jpg, .jpeg" required>
        <br><br>
        <img id="preview" alt="Image Preview">
        <br><br>
        <button type="submit">Upload</button>
    </form>

    {% if filename %}
        <p style="color: green; font-weight: bold;">✅ Image "{{ filename }}" uploaded successfully! Redirecting...</p>
        <script>
            setTimeout(() => window.location.href = "/result/{{ filename }}", 2000);
        </script>
    {% endif %}

    <script>
        document.getElementById("fileInput").onchange = event => {
            let file = event.target.files[0];
            if (file) {
                let preview = document.getElementById("preview");
                preview.src = URL.createObjectURL(file);
                preview.style.display = "block";
            }
        };
    </script>

</body>
</html>
